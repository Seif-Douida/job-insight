# Companies whose public job boards are read directly. These give full-text postings,
# so this list is the main lever on coverage and on sample bias: it leans toward
# companies using modern ATS platforms. Grow it deliberately, especially for the Gulf.
#
# Find a company's board with:
#     python -m pipeline.ingest.probe_boards <slug> [<slug> ...]
#
#   name   display name, used as the posting's company
#   ats    greenhouse | lever | ashby
#   board  the board token in that platform's public API URL
#
# Seeded 2026-09-17 from a probe of ~260 candidates: every board with at least one
# in-scope posting that day. Companies found on two platforms (mid-migration) are listed
# once, on Ashby. Careem and Ziina had no in-scope postings but are kept for the Gulf,
# where job-board coverage is scarce.

